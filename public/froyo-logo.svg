<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background / Cup Gradients -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFE4EC" />
      <stop offset="100%" stop-color="#FFD1DF" />
    </linearGradient>

    <!-- Swirl Yogurt Gradients -->
    <linearGradient id="yogurtSwirl1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F8" />
      <stop offset="60%" stop-color="#FFA6C1" />
      <stop offset="100%" stop-color="#FF85A1" />
    </linearGradient>

    <linearGradient id="yogurtSwirl2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE0E9" />
    </linearGradient>

    <!-- Cherry Gradient -->
    <radialGradient id="cherryGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF758F" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="froyoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF85A1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="60" cy="112" rx="36" ry="6" fill="#FCE7ED" opacity="0.8" />

  <!-- The Froyo Cup -->
  <g filter="url(#froyoGlow)">
    <!-- Cup Base and Body -->
    <path
      d="M26 66 L34 104 Q35 108 40 108 L80 108 Q85 108 86 104 L94 66 Z"
      fill="url(#cupGrad)"
      stroke="#FF85A1"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Cup Rim Scallop -->
    <path
      d="M24 66 Q30 63 36 66 Q42 63 48 66 Q54 63 60 66 Q66 63 72 66 Q78 63 84 66 Q90 63 96 66 L94 69 Q88 66 84 69 Q78 66 72 69 Q66 66 60 69 Q54 66 48 69 Q42 66 36 69 Q30 66 24 69 Z"
      fill="#FF85A1"
    />

    <!-- Cup Cute Face -->
    <!-- Closed Happy Eyes (◠‿◠) -->
    <path d="M47 84 Q52 79 57 84" fill="none" stroke="#65454E" stroke-width="2.2" stroke-linecap="round" />
    <path d="M63 84 Q68 79 73 84" fill="none" stroke="#65454E" stroke-width="2.2" stroke-linecap="round" />
    <!-- Blushing Cheeks -->
    <ellipse cx="43" cy="87" rx="3.5" ry="2" fill="#FF85A1" opacity="0.65" />
    <ellipse cx="77" cy="87" rx="3.5" ry="2" fill="#FF85A1" opacity="0.65" />
    <!-- Sweet Smile -->
    <path d="M57 89 Q60 93 63 89" fill="none" stroke="#65454E" stroke-width="2" stroke-linecap="round" />

    <!-- Soft Serve Swirl Layers -->
    <!-- Bottom Swirl Layer -->
    <path
      d="M22 66 Q20 54 36 50 Q48 46 60 48 Q72 46 84 50 Q100 54 98 66 Q88 71 60 70 Q32 71 22 66 Z"
      fill="url(#yogurtSwirl1)"
      stroke="#FF85A1"
      stroke-width="2.2"
    />

    <!-- Middle Swirl Layer -->
    <path
      d="M30 52 Q32 38 48 35 Q60 32 72 35 Q88 38 90 52 Q78 57 60 56 Q42 57 30 52 Z"
      fill="url(#yogurtSwirl2)"
      stroke="#FFA6C1"
      stroke-width="2"
    />

    <!-- Upper Swirl Layer -->
    <path
      d="M40 38 Q44 24 60 21 Q76 24 80 38 Q70 42 60 41 Q50 42 40 38 Z"
      fill="url(#yogurtSwirl1)"
      stroke="#FF85A1"
      stroke-width="1.8"
    />

    <!-- Top Swirl Peak Tip -->
    <path
      d="M52 24 Q60 14 66 12 Q64 18 68 23 Z"
      fill="#FFF0F5"
      stroke="#FF85A1"
      stroke-width="1.5"
    />
  </g>

  <!-- Colorful Sprinkles -->
  <!-- Yellow Star/Pill Sprinkles -->
  <rect x="42" y="44" width="5" height="2.2" rx="1.1" fill="#FBBF24" transform="rotate(-25 42 44)" />
  <rect x="74" y="46" width="5" height="2.2" rx="1.1" fill="#FBBF24" transform="rotate(35 74 46)" />
  <!-- Mint Green Sprinkles -->
  <rect x="54" y="34" width="4.5" height="2" rx="1" fill="#34D399" transform="rotate(15 54 34)" />
  <rect x="36" y="58" width="4.5" height="2" rx="1" fill="#34D399" transform="rotate(-40 36 58)" />
  <!-- Purple Lilac Sprinkles -->
  <rect x="66" y="32" width="4.5" height="2" rx="1" fill="#A78BFA" transform="rotate(-30 66 32)" />
  <rect x="80" y="58" width="5" height="2" rx="1" fill="#A78BFA" transform="rotate(20 80 58)" />
  <!-- Coral Pink Sprinkles -->
  <rect x="58" y="48" width="5" height="2.2" rx="1.1" fill="#F43F5E" transform="rotate(5 58 48)" />

  <!-- Maraschino Cherry On Top -->
  <g>
    <!-- Cherry Stem -->
    <path
      d="M66 12 Q75 2 82 5"
      fill="none"
      stroke="#15803D"
      stroke-width="2"
      stroke-linecap="round"
    />
    <!-- Tiny Green Leaf -->
    <path
      d="M74 4 Q79 2 80 5 Q77 7 74 4 Z"
      fill="#22C55E"
    />
    <!-- Glossy Cherry Body -->
    <circle cx="66" cy="13" r="7.5" fill="url(#cherryGrad)" stroke="#BE123C" stroke-width="1.2" />
    <!-- Cherry Specular Highlight -->
    <ellipse cx="64" cy="10.5" rx="2" ry="1.2" fill="#FFFFFF" opacity="0.8" transform="rotate(-25 64 10.5)" />
  </g>

  <!-- Sparkle Stars -->
  <path
    d="M18 42 Q23 42 23 37 Q23 42 28 42 Q23 42 23 47 Q23 42 18 42 Z"
    fill="#FBBF24"
    opacity="0.9"
  />
  <path
    d="M98 34 Q101 34 101 31 Q101 34 104 34 Q101 34 101 37 Q101 34 98 34 Z"
    fill="#FF85A1"
    opacity="0.9"
  />
</svg>
